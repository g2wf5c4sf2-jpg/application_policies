<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Application policies</title>
<style>
  :root { --ink:#1b1b1f; --muted:#55555f; --ground:#fff; --rule:#d8d8de; --accent:#4b3fa8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6e4ea; --muted:#a3a1ad; --ground:#16161a; --rule:#33333c; --accent:#b9a8ff; }
  }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
    font-size:17px; line-height:1.6;
  }
  main { max-width:40rem; margin:0 auto; padding:3rem 1.25rem 5rem; }
  h1 { font-size:1.6rem; margin:0 0 1.5rem; padding-bottom:1.25rem;
       border-bottom:1px solid var(--rule); letter-spacing:-0.01em; }
  p { margin:0 0 1rem; }
  ul { margin:0; padding-left:1.15rem; }
  li { margin-bottom:0.5rem; }
  a { color:var(--accent); }
  .muted { color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>
<main>
<h1>Application policies</h1>
<p>Privacy policies and terms for published applications.</p>
<ul>
  <li>Response Card: <a href="response-card/">privacy policy</a>,
      <a href="response-card/terms.html">terms and conditions</a></li>
</ul>
<p class="muted">Each page is self-contained and makes no request to any other
host.</p>
</main>
</body>
</html>
